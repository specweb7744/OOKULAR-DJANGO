name: Django foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ookular_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: ookular_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ookular_test -d ookular_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ookular_test:ci-test-only@127.0.0.1:5432/ookular_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check --settings=config.settings.test
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: python manage.py test backend --settings=config.settings.test
      - run: python manage.py test backend --settings=config.settings.ci_postgres
