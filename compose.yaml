# Optional local PostgreSQL. The Django process runs on the host.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ookular}
      POSTGRES_USER: ${POSTGRES_USER:-ookular}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_local.py first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ookular_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ookular_database:
